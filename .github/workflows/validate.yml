# Validates the registry on every pull request and every push to main.
#
# There's no paths filter on purpose: this check will become required on main,
# and a required check that doesn't run would leave unrelated PRs blocked.

name: Validate registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed to diff against the base commit

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements*.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check schema matches vocabularies
        run: python scripts/sync_vocabularies.py --check

      # Duplicate warnings only cover records added or changed since the base
      # commit, so look-alikes already in the registry aren't re-reported.
      - name: Validate scenario records
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            mapfile -t changed < <(git diff --name-only --diff-filter=AMR "$BASE_SHA" HEAD -- registry/scenarios/)
            python scripts/validate_registry.py --changed "${changed[@]}"
          else
            python scripts/validate_registry.py
          fi

      - name: Build index
        run: python scripts/build_index.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-index
          path: registry/index.json
